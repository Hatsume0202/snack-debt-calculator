<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜宵债复利计算器</title>
<style>
:root{color-scheme:dark;--bg:#100d0e;--panel:#1b1517;--panel2:#241a1c;--line:#3a292c;--red:#ef4d4d;--red2:#ff7770;--text:#f7eeee;--muted:#aa9697;--gold:#e5b36c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#4a171b 0,transparent 34rem),var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5}main{width:min(1060px,100%);margin:auto;padding:34px 18px 48px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:26px}.eyebrow{color:var(--red2);font-size:12px;letter-spacing:.18em;font-weight:700}.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.1;margin:8px 0 10px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);font-size:14px}.stamp{border:1px solid var(--line);padding:10px 14px;color:var(--gold);font-size:12px;white-space:nowrap;border-radius:8px;background:#171112}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:linear-gradient(145deg,rgba(38,27,29,.95),rgba(23,18,19,.98));border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 16px 45px #0004}.card h2{font-size:16px;margin:0 0 20px}.fields{display:grid;gap:15px}label{display:grid;gap:7px;color:var(--muted);font-size:13px}input{width:100%;font:inherit;color:var(--text);background:#120f10;border:1px solid #493437;border-radius:8px;padding:11px 12px;outline:none;transition:.2s}input:focus{border-color:var(--red);box-shadow:0 0 0 3px #ef4d4d1c}input[type=number]{appearance:textfield}.hint{font-size:11px;color:#796a6b;margin-top:13px}.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.result-head h2{margin:0}.days{color:var(--gold);font-size:13px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#151112;border:1px solid #332528;border-radius:10px;padding:13px}.metric.wide{grid-column:span 2}.metric .label{font-size:12px;color:var(--muted);margin-bottom:5px}.value{font-size:22px;font-weight:700;letter-spacing:-.02em}.unit{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}.accent .value{color:var(--red2)}.gold .value{color:var(--gold)}.compare{margin-top:10px;padding:14px;border-radius:10px;background:linear-gradient(100deg,#3a171b,#211719);border:1px solid #6d2d31}.compare-title{font-size:13px;font-weight:700;color:var(--red2)}.compare-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px}.compare-row strong{font-size:20px}.compare-row span{font-size:12px;color:var(--muted)}.bar{height:6px;background:#432427;border-radius:99px;overflow:hidden;margin-top:11px}.bar i{display:block;height:100%;background:var(--red);border-radius:inherit;transition:width .3s}.chart-card{grid-column:1/-1}.chart-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.chart-title h2{margin:0}.chart-title span{font-size:12px;color:var(--muted)}canvas{display:block;width:100%;height:240px;background:#130f10;border-radius:9px;border:1px solid #332528}.footer{color:#756667;text-align:center;font-size:12px;margin-top:22px}@media(max-width:760px){main{padding:24px 13px 35px}.hero{display:block}.stamp{display:inline-block;margin-top:15px}.layout{grid-template-columns:1fr}.chart-card{grid-column:auto}.card{padding:18px}.metrics{grid-template-columns:1fr 1fr}.metric.wide{grid-column:span 2}}@media(max-width:390px){.metrics{grid-template-columns:1fr}.metric.wide{grid-column:auto}}
</style>
</head>
<body><main>
<header class="hero"><div><div class="eyebrow">NIGHT SNACK · COMPOUND INTEREST</div><h1>夜宵债复利计算器</h1><p>把今晚的 95 分，算到结算那一天。</p></div><div class="stamp">单串按 51 分计</div></header>
<section class="layout">
<div class="card"><h2>输入账目</h2><div class="fields">
<label>本金（分）<input id="principal" type="number" min="0" step="1" value="95"></label>
<label>日利率（%）<input id="rate" type="number" min="0" step="0.1" value="5"></label>
<label>起算日期<input id="start" type="date"></label>
<label>结算日期<input id="end" type="date"></label>
</div><div class="hint">按自然日计算，起算日不计入，结算日计入。</div></div>
<div class="card"><div class="result-head"><h2>结算结果</h2><div class="days">计息 <b id="days">0</b> 天</div></div><div class="metrics">
<div class="metric"><div class="label">单利终值</div><div class="value" id="simple">0<span class="unit">分</span></div></div>
<div class="metric accent"><div class="label">复利终值</div><div class="value" id="compound">0<span class="unit">分</span></div></div>
<div class="metric"><div class="label">利息总额（复利）</div><div class="value" id="interest">0<span class="unit">分</span></div></div>
<div class="metric gold"><div class="label">等效年化利率</div><div class="value" id="annual">0<span class="unit">%</span></div></div>
<div class="metric wide"><div class="label">折算夜宵串数</div><div class="value" id="strings">0<span class="unit">串</span></div></div>
</div><div class="compare"><div class="compare-title">“九出十三归”对照</div><div class="compare-row"><strong id="target">达标线 0 分</strong><span id="gap">还需 0 分</span></div><div class="bar"><i id="bar"></i></div></div></div>
<div class="card chart-card"><div class="chart-title"><h2>复利增长曲线</h2><span>本金 → 复利终值</span></div><canvas id="chart" aria-label="复利增长曲线"></canvas></div>
</section><div class="footer">所有结果均以“分”为单位，金额仅作趣味演示。</div>
</main>
<script>
const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const today=new Date();const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
$('start').value=iso(today);const later=new Date(today);later.setDate(later.getDate()+30);$('end').value=iso(later);
function money(n){return n.toLocaleString('zh-CN',{maximumFractionDigits:2})}
function draw(days,p,r){const c=$('chart'),dpr=devicePixelRatio||1,rect=c.getBoundingClientRect();c.width=rect.width*dpr;c.height=rect.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const w=rect.width,h=rect.height;const padX=35,padY=24; x.clearRect(0,0,w,h);let vals=Array.from({length:Math.max(days+1,2)},(_,i)=>p*Math.pow(1+r,i));let max=Math.max(...vals,p*1.05), min=p; x.strokeStyle='#38272a';x.lineWidth=1;for(let i=0;i<4;i++){let y=padY+(h-padY*2)*i/3;x.beginPath();x.moveTo(padX,y);x.lineTo(w-15,y);x.stroke()}const point=i=>({x:padX+(w-padX-15)*i/(vals.length-1),y:h-padY-(vals[i]-min)/(max-min||1)*(h-padY*2)});const grad=x.createLinearGradient(0,padY,0,h);grad.addColorStop(0,'#ef4d4d55');grad.addColorStop(1,'#ef4d4d00');x.beginPath();vals.forEach((_,i)=>{let q=point(i);i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y)});x.lineTo(point(vals.length-1).x,h-padY);x.lineTo(padX,h-padY);x.closePath();x.fillStyle=grad;x.fill();x.beginPath();vals.forEach((_,i)=>{let q=point(i);i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y)});x.strokeStyle='#ff625e';x.lineWidth=2.5;x.stroke();x.fillStyle='#9d8586';x.font='11px sans-serif';x.fillText('第 0 天',padX,h-7);x.textAlign='right';x.fillText(`第 ${days} 天`,w-15,h-7);x.textAlign='left';x.fillText(`${money(max)} 分`,padX,14);}
function calculate(){const p=Math.max(0,Number($('principal').value)||0),r=Math.max(0,Number($('rate').value)||0)/100;const a=new Date($('start').value+'T00:00:00'),b=new Date($('end').value+'T00:00:00');let days=Math.max(0,Math.round((b-a)/86400000));const simple=p*(1+r*days),compound=p*Math.pow(1+r,days),interest=compound-p,target=p*1.44,gap=Math.max(0,target-compound);$('days').textContent=days;$('simple').innerHTML=`${money(simple)}<span class="unit">分</span>`;$('compound').innerHTML=`${money(compound)}<span class="unit">分</span>`;$('interest').innerHTML=`${money(interest)}<span class="unit">分</span>`;$('annual').innerHTML=`${money((Math.pow(1+r,365)-1)*100)}<span class="unit">%</span>`;$('strings').innerHTML=`${money(compound/51)}<span class="unit">串</span>`;$('target').textContent=`达标线 ${money(target)} 分`;$('gap').textContent=gap?'还需 '+money(gap)+' 分':'已超过达标线';$('bar').style.width=Math.min(100,compound/target*100)+'%';draw(days,p,r)}
['principal','rate','start','end'].forEach(id=>$(id).addEventListener('input',calculate));addEventListener('resize',calculate);calculate();
</script></body></html>
